<div class="min-h-screen flex items-center justify-center bg-gray-900 text-white">
  <div class="bg-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-gray-700">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold tracking-wider text-blue-400">SUPERMERCADO CON GIT</h1>
      <p class="text-sm text-gray-400 mt-1">Inicia sesión para continuar</p>
    </div>

    @if (errorMessage) {
      <div class="mb-4 p-3 bg-red-500/20 border border-red-500 text-red-300 text-sm rounded-lg text-center">
        {{ errorMessage }}
      </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1">Usuario</label>
        <input 
          type="text" 
          formControlName="username"
          class="w-full px-4 py-2 bg-gray-900 border border-gray-700 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-white"
          placeholder="Ej. admin"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1">Contraseña</label>
        <input 
          type="password" 
          formControlName="password"
          class="w-full px-4 py-2 bg-gray-900 border border-gray-700 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-white"
          placeholder="••••••••"
        />
      </div>

      <button 
        type="submit" 
        [disabled]="loginForm.invalid"
        class="w-full py-3 bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white font-semibold rounded-lg transition duration-200 shadow-lg mt-2"
      >
        Ingresar al Sistema
      </button>
    </form>
  </div>
</div>
